[package]
name = "ninebot-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "ninebot_ffi"

[dependencies]
jni = "0.19"
thiserror = "1.0"
hex = "0.4"
pretty-hex = "0.3"

# The crypto lives in exactly one place.
#
# This crate used to carry its own copy of `src/mi_crypto.rs` alongside
# ninebot-ble's. The two were byte-identical except for commented-out tracing
# calls, so nothing was broken *yet* — but it meant the ECDH / HKDF / AES-CCM
# implementation existed twice, and a security fix applied to one copy would
# silently miss the other. This is the only implementation now.
#
# `default-features = false` is required, not stylistic: ninebot-ble's default
# `ble` feature pulls in btleplug, whose Linux backend needs `pkg-config` +
# `libdbus-1-dev`. This crate only needs the protocol core, so it opts out and
# stays buildable on a bare host as well as on Android.
ninebot-ble = { path = "../ninebot-ble", default-features = false }

p256 = { version = "0.10.1", features = ["ecdsa", "ecdh"] }
elliptic-curve = "0.11.9"
