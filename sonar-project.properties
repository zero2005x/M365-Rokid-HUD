# SonarCloud / SonarQube project configuration
sonar.organization=zero2005x
sonar.projectKey=zero2005x_M365-Rokid-HUD
sonar.projectName=M365-Rokid-HUD

# Kotlin/Java scope only. Rust is tested separately in CI; no Rust Sonar analysis is claimed.
# Source directories
sonar.sources=app/src/main/java,glass-hud/src/main/java
sonar.tests=app/src/test/java,glass-hud/src/test/java

# Encoding & Exclusions
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/build/**,**/dist/**,**/*.so,**/jniLibs/**,**/assets/**,**/*.lc

# Kover XML is JaCoCo-compatible. Generated by CI via
# :app:koverXmlReportDebug and :glass-hud:koverXmlReportDebug.
# The root project is not an Android module, so there is no merged
# :koverXmlReportDebug — Sonar consumes both module reports.
# Without this, SonarCloud prints 0% coverage for every file — including
# parsers that already have unit tests — because no report is uploaded.
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/kover/reportDebug.xml,glass-hud/build/reports/kover/reportDebug.xml

# Protocol-mandated crypto in NinebotCryptoCipher.kt: SHA-1 key derivation
# (kotlin:S4790) and AES-128-ECB single-block (kotlin:S5542) are fixed by the
# NinebotCrypto wire format and cannot change without breaking scooter interop.
# These are a faithful reimplementation of an external protocol, not app crypto.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=kotlin:S4790
sonar.issue.ignore.multicriteria.e1.resourceKey=**/protocol/NinebotCryptoCipher.kt
sonar.issue.ignore.multicriteria.e2.ruleKey=kotlin:S5542
sonar.issue.ignore.multicriteria.e2.resourceKey=**/protocol/NinebotCryptoCipher.kt
