<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="1024" height="500" fill="url(#paint0_linear)"/>
    
    <g opacity="0.1">
        <path d="M0 50H1024" stroke="white" stroke-width="2"/>
        <path d="M0 150H1024" stroke="white" stroke-width="2"/>
        <path d="M0 250H1024" stroke="white" stroke-width="2"/>
        <path d="M0 350H1024" stroke="white" stroke-width="2"/>
        <path d="M0 450H1024" stroke="white" stroke-width="2"/>
        <path d="M100 0V500" stroke="white" stroke-width="2"/>
        <path d="M300 0V500" stroke="white" stroke-width="2"/>
        <path d="M500 0V500" stroke="white" stroke-width="2"/>
        <path d="M700 0V500" stroke="white" stroke-width="2"/>
        <path d="M900 0V500" stroke="white" stroke-width="2"/>
        <circle cx="100" cy="50" r="10" fill="white"/>
        <circle cx="300" cy="150" r="10" fill="white"/>
        <circle cx="500" cy="250" r="10" fill="white"/>
        <circle cx="700" cy="350" r="10" fill="white"/>
        <circle cx="900" cy="450" r="10" fill="white"/>
    </g>

    <g transform="translate(50, 50)">
        <rect x="50" y="20" width="220" height="400" rx="20" fill="#1A2B4D" stroke="white" stroke-width="4"/>
        <rect x="60" y="50" width="200" height="340" fill="#0D1B33"/>
        <text x="160" y="80" font-family="Arial" font-weight="bold" font-size="16" fill="white" text-anchor="middle">M365 Dashboard</text>
        <circle cx="160" cy="180" r="80" stroke="#00E5FF" stroke-width="10" stroke-dasharray="380" stroke-dashoffset="100" transform="rotate(-90 160 180)"/>
        <text x="160" y="180" font-family="Arial" font-weight="bold" font-size="48" fill="white" text-anchor="middle">25</text>
        <text x="160" y="210" font-family="Arial" font-size="18" fill="#00E5FF" text-anchor="middle">km/h</text>
        <rect x="80" y="280" width="160" height="20" rx="10" fill="#333"/>
        <rect x="80" y="280" width="120" height="20" rx="10" fill="#00E5FF"/>
        <text x="160" y="295" font-family="Arial" font-size="14" fill="white" text-anchor="middle">75% Battery</text>
        <g transform="translate(135, 330) scale(1.5)">
            <path d="M0 20H30L27 10H3L0 20ZM5 10V0H15V10" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="3" cy="20" r="3" fill="#00E5FF"/>
            <circle cx="27" cy="20" r="3" fill="#00E5FF"/>
        </g>
        <path d="M270 220C350 220 400 180 450 150" stroke="#00E5FF" stroke-width="4" stroke-dasharray="10 5">
            <animate attributeName="stroke-dashoffset" from="0" to="-30" duration="1s" repeatCount="indefinite"/>
        </path>
    </g>

    <g transform="translate(500, 50)">
        <path d="M50 100C20 100 0 120 0 150V200C0 230 20 250 50 250H120C150 250 170 230 170 200V180C170 175 175 170 180 170C185 170 190 175 190 180V200C190 230 210 250 240 250H310C340 250 360 230 360 200V150C360 120 340 100 310 100H240C210 100 190 120 190 150V155C190 158 188 160 185 160C182 160 180 158 180 155V150C180 120 160 100 130 100H50Z" fill="white" opacity="0.9"/>
        
        <ellipse cx="90" cy="175" rx="70" ry="50" fill="url(#paint1_radial)" opacity="0.6"/>
        <ellipse cx="270" cy="175" rx="70" ry="50" fill="url(#paint1_radial)" opacity="0.6"/>

        <g transform="translate(30, 140)">
            <path d="M20 40C20 20 40 0 60 0C80 0 100 20 100 40" stroke="#00E5FF" stroke-width="6" stroke-linecap="round"/>
            <text x="60" y="35" font-family="Arial" font-weight="bold" font-size="28" fill="white" text-anchor="middle">25</text>
            <text x="60" y="55" font-family="Arial" font-size="12" fill="#00E5FF" text-anchor="middle">KM/H</text>
             <g transform="translate(100, -10) scale(0.8)">
                 <rect x="0" y="15" width="6" height="15" fill="#00E5FF"/>
                 <rect x="8" y="10" width="6" height="20" fill="#00E5FF"/>
                 <rect x="16" y="5" width="6" height="25" fill="#00E5FF"/>
                 <rect x="24" y="0" width="6" height="30" fill="#00E5FF" opacity="0.3"/>
            </g>
        </g>

         <g transform="translate(210, 140)">
            <rect x="20" y="20" width="80" height="40" rx="5" stroke="#00E5FF" stroke-width="3"/>
            <path d="M100 30H105V50H100V30Z" fill="#00E5FF"/>
            <rect x="25" y="25" width="55" height="30" rx="3" fill="#00E5FF"/>
            <text x="60" y="48" font-family="Arial" font-weight="bold" font-size="18" fill="white" text-anchor="middle">75%</text>
            <text x="60" y="85" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Range: 30km</text>
        </g>
    </g>

    <text x="512" y="420" font-family="Arial" font-weight="bold" font-size="40" fill="white" text-anchor="middle" letter-spacing="2">M365 Rokid HUD</text>
    <text x="540" y="460" font-family="Arial" font-size="24" fill="#00E5FF" text-anchor="middle">Smart AR Dashboard for Your Scooter</text>

    <defs>
        <linearGradient id="paint0_linear" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0A192F"/> <stop offset="1" stop-color="#1E3C72"/> </linearGradient>
        <radialGradient id="paint1_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 175) rotate(90) scale(50 70)">
            <stop stop-color="#00E5FF"/>
            <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
        </radialGradient>
    </defs>
</svg>
