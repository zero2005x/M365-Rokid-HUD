# Gradle 9.6.1 + AGP 9.0.0 compatible settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Run the Kotlin compiler inside the Gradle process instead of forking the
# Kotlin daemon.
#
# The daemon writes a marker file under $HOME/.local/share/kotlin/daemon. When
# $HOME is not writable — a locked-down CI runner, a container with a read-only
# home, this workspace — the daemon cannot start and every Kotlin task prints:
#
#   e: java.nio.file.FileSystemException: .../kotlin-daemon-client-*.tmp:
#      Read-only file system
#   e: Daemon compilation failed: Could not connect to Kotlin compile daemon
#
# AGP 9 falls back to its built-in compiler so the build still succeeds, but the
# errors are alarming and hide real failures. In-process compilation removes the
# daemon from the picture entirely. The cost is losing daemon warm-start on
# incremental builds, which is not worth a build log that cannot be trusted to
# distinguish a warning from a failure.
kotlin.compiler.execution.strategy=in-process

# AGP 9.0 settings (using defaults)
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Performance optimization - use constraints=false instead of deprecated excludeLibraryComponentsFromConstraints
android.dependency.useConstraints=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
