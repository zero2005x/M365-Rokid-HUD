# SonarCloud / SonarQube project configuration
sonar.organization=zero2005x
sonar.projectKey=zero2005x_M365-Rokid-HUD
sonar.projectName=M365-Rokid-HUD

# Kotlin/Java scope only. Rust is tested separately in CI; no Rust Sonar analysis is claimed.
# Source directories
sonar.sources=app/src/main/java,glass-hud/src/main/java
sonar.tests=app/src/test/java,glass-hud/src/test/java

# Encoding & Exclusions
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/build/**,**/dist/**,**/*.so,**/jniLibs/**,**/assets/**,**/*.lc

# Kover XML is JaCoCo-compatible. Generated by CI via
# :app:koverXmlReportDebug and :glass-hud:koverXmlReportDebug.
# The root project is not an Android module, so there is no merged
# :koverXmlReportDebug — Sonar consumes both module reports.
# Without this, SonarCloud prints 0% coverage for every file — including
# parsers that already have unit tests — because no report is uploaded.
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/kover/reportDebug.xml,glass-hud/build/reports/kover/reportDebug.xml

# Coverage exclusions: code that JVM unit tests structurally cannot execute, so
# measuring its coverage only depresses the metric with lines no unit test can
# reach. These files are still analysed for smells/bugs; they are only excluded
# from the coverage ratio. Covering them needs Robolectric/instrumented tests
# (a separate effort), not unit tests.
#   - **/ui/**            Jetpack Compose screens/theme/components
#   - **/*Activity.kt     Android Activities
#   - **/gateway/**       foreground services, GATT server, prefs stores
#   - **/ble/BleManager.kt, **/glass/BleClient.kt, **/glass/BleConnectionService.kt
#                         BluetoothGatt / scanning wrappers
#   - **/glass/HudScreen.kt, **/glass/cxr/**, **/glass/wifi/UnifiedConnectionManager.kt,
#     **/glass/wifi/WifiGatewayClient.kt   glasses runtime (UI / NSD / sockets)
#   - **/repository/ScooterRepository.kt   BLE+context session hub
#   - **/ffi/**, **/io/github/gedgygedgy/** JNI bridge + vendored rust-jni helpers
#   - **/utils/**         Context/BluetoothAdapter/file-IO helpers
#   - ProtocolProbe / ModelOverrideStore / VehicleSnapshotStore
#                         SharedPreferences-backed persistence stores
# The measured surface is the pure protocol/logic layer, which is 80-96% covered.
sonar.coverage.exclusions=**/ui/**,**/*Activity.kt,**/gateway/**,**/ble/BleManager.kt,**/repository/ScooterRepository.kt,**/repository/VehicleSnapshotStore.kt,**/protocol/ProtocolProbe.kt,**/protocol/ModelOverrideStore.kt,**/ffi/**,**/utils/**,**/glass/BleClient.kt,**/glass/BleConnectionService.kt,**/glass/HudScreen.kt,**/glass/cxr/**,**/glass/wifi/UnifiedConnectionManager.kt,**/glass/wifi/WifiGatewayClient.kt,**/io/github/gedgygedgy/**

# Protocol-mandated crypto in NinebotCryptoCipher.kt: SHA-1 key derivation
# (kotlin:S4790) and AES-128-ECB single-block (kotlin:S5542) are fixed by the
# NinebotCrypto wire format and cannot change without breaking scooter interop.
# These are a faithful reimplementation of an external protocol, not app crypto.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=kotlin:S4790
sonar.issue.ignore.multicriteria.e1.resourceKey=**/protocol/NinebotCryptoCipher.kt
sonar.issue.ignore.multicriteria.e2.ruleKey=kotlin:S5542
sonar.issue.ignore.multicriteria.e2.resourceKey=**/protocol/NinebotCryptoCipher.kt
