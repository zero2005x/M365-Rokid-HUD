[package]
name = "ninebot-ble"
version = "0.1.2"
edition = "2021"
license-file = "LICENSE.md"
description = "A lightweight Rust library for BLE communication with Ninebot/Xiaomi electric scooters"
keywords = ["ninebot", "xiaomi", "m365", "electric-scooter", "ble"]
repository = "https://github.com/zero2005x/ninebot-ble"
authors = ["zero2005x <zero2005x@gmail.com>"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `ble` pulls in the host/platform Bluetooth stack. It is ON by default, so the
# published crate behaves exactly as before.
#
# Turn it OFF to compile and test just the protocol logic:
#
#     cargo test --no-default-features
#
# This matters on Linux hosts: btleplug's Linux backend depends on `dbus`,
# whose build script needs `pkg-config` + `libdbus-1-dev`. Neither is needed to
# unit-test framing, CRC, the crypto, or the telemetry decoders, so without this
# feature `cargo test` fails on a bare CI runner for reasons that have nothing
# to do with the code under test.
default = ["ble"]
ble = ["dep:btleplug", "dep:jni", "dep:android_logger", "dep:once_cell", "dep:chrono"]

# State-changing commands: motor lock/unlock, tail light, KERS, cruise.
#
# OFF by default and deliberately so. Reading a wrong register yields a wrong
# number; WRITING one changes the vehicle. The multi-model register maps are only
# partly confirmed, and `lock()` disables the motor — a safety-relevant action
# that should not be reachable by a default build. See session/mod.rs.
# `write-ops` implies `ble`: the write modules are `impl MiSession` blocks, and
# `MiSession` only exists with a transport. Declaring the dependency here means
# `--features write-ops` works on its own instead of failing to resolve
# `MiSession` — a broken feature flag is worse than none.
write-ops = ["ble"]

[dependencies]
# --- transport only (see the `ble` feature) ---
btleplug = { version = "0.11", features = ["serde"], optional = true }
jni = { version = "0.19", optional = true }
android_logger = { version = "0.13", optional = true }
once_cell = { version = "1.18", optional = true }
chrono = { version = "0.4", optional = true }

# --- protocol core: always compiled, no Bluetooth stack required ---
serde = { version = "1.0.136", features = ["derive"] }
p256 = { version = "0.10.1", features = ["ecdsa", "ecdh"] }
rand_core = "0.6.3"
elliptic-curve = "0.11.9"
ccm = "0.4.4"
aes = { version = "0.7", features = ["force-soft"] }
hkdf = "0.12.0"
sha2 = "0.10.1"
# Ninebot legacy crypto derives its session key with SHA-1 (the protocol's
# choice, not ours). Same generation as sha2 so the `Digest` trait matches.
sha1 = "0.10.1"
hex-literal = "0.3.4"
hmac = "0.12.1"

# Lets `Transport` be an async trait. Needed because the real
# implementation wraps btleplug (async); a sync trait could only ever
# have been implemented by the mock, which would defeat the point.
async-trait = "0.1"
pretty-hex = "0.2.1"
tokio = { version = "1.15.0", features = ["full"] }
futures-util = "0.3.19"
futures = "0.3.19"
tokio-stream = "0.1.8"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0.53"
thiserror = "1.0.30"
tracing = "0.1"
log = "0.4"

hex = "0.4"

[dev-dependencies]
tracing-subscriber = { version = "0.3.7", features = ["tracing-log"] }

# Examples are auto-discovered from examples/*.rs.
#
# There used to be twelve explicit [[[example]]] entries here, six of which
# (clone_test, clone_debug, raw_probe, miauth_test, monitor, controller)
# pointed at files that had been deleted. Cargo refuses to even parse a
# manifest that names a missing target, so every cargo command in this crate
# failed with "can't find `clone_debug` example". Relying on auto-discovery
# means the manifest can never again drift from what is on disk.
#
# Every example drives a real radio, so each one needs the `ble` feature. Naming
# them here (rather than re-listing their [[[example]]] blocks) keeps
# auto-discovery for the *files* while telling Cargo not to build them when the
# feature is off — otherwise `cargo test --no-default-features` fails in the
# examples with E0432 instead of running the protocol-core tests.
[[example]]
name = "about"
required-features = ["ble"]

[[example]]
name = "login"
required-features = ["ble"]

[[example]]
name = "register"
required-features = ["ble"]

[[example]]
name = "scanner"
required-features = ["ble"]

[[example]]
name = "settings"
required-features = ["ble"]

[[example]]
name = "speed"
required-features = ["ble"]
