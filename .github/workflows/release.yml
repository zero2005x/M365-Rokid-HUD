name: Release

# Builds both APKs and attaches them to the GitHub Release for a pushed tag.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  base64 of release.jks   (see below)
#   RELEASE_STORE_PASSWORD   keystore password
#   RELEASE_KEY_ALIAS        key alias, e.g. m365key
#   RELEASE_KEY_PASSWORD     key password
#
# To produce RELEASE_KEYSTORE_BASE64 on Windows PowerShell:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\Users\liangtinglin\Documents\codebase\release.jks")) | Set-Clipboard
#
# The signing certificate must stay SHA256 7C:A3:A3:F7:... or already-installed
# builds cannot be updated by sideload.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and upload to'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust with Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ninebot-ffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ninebot-ffi/Cargo.toml', 'ninebot-ffi/src/**') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Write local.properties
        # The build reads signing config and sdk.dir from this file. It is
        # gitignored, so CI has to synthesise it. ANDROID_NDK_HOME is exported
        # for cargo-ndk, which resolves the NDK from the environment.
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.jks"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          keytool -list -keystore release.jks \
            -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" >/dev/null
          echo "Keystore decoded and readable"

      - name: Build release APKs
        # chmod is belt-and-braces: gradlew is committed with mode 100755, but
        # the bit is easy to lose again from a Windows checkout, where git's
        # core.filemode defaults to false. Without it the runner fails with
        # "./gradlew: Permission denied" (exit 126).
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease :glass-hud:assembleRelease

      - name: Verify 16 KB page alignment of the native library
        # Google Play rejects shared libraries whose PT_LOAD segments are not
        # 16 KB aligned. The linker flags live in ninebot-ffi/.cargo/config.toml,
        # but RUSTFLAGS in the environment silently overrides them, so verify the
        # artifact rather than trusting the config.
        run: |
          fail=0
          for so in app/src/main/jniLibs/*/libninebot_ffi.so; do
            aligns=$(llvm-readelf -l "$so" 2>/dev/null | awk '$1=="LOAD"{print $NF}')
            [ -z "$aligns" ] && aligns=$(readelf -l "$so" | awk '$1=="LOAD"{print $NF}')
            for a in $aligns; do
              case "$a" in
                0x4000|0x10000) ;;
                *) echo "::error::$so has PT_LOAD align $a, expected 0x4000"; fail=1 ;;
              esac
            done
            echo "$so: $aligns"
          done
          exit $fail

      - name: Verify both APKs are signed with the expected certificate
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/app-release.apk \
                     glass-hud/build/outputs/apk/release/glass-hud-release.apk; do
            echo "--- $apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest"
          done

      - name: Stage artifacts with descriptive names
        id: stage
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/M365-Rokid-HUD-phone-$TAG.apk"
          cp glass-hud/build/outputs/apk/release/glass-hud-release.apk \
             "dist/M365-Rokid-HUD-glasses-$TAG.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.stage.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber

      - name: Remove keystore
        if: always()
        run: rm -f release.jks local.properties
