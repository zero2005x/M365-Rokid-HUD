name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  ci-build-and-test:
    name: Build, Test & Sonar Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Match the JDK used for local build verification.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------------------
      # Rust toolchain
      #
      # Required, not optional. `System.loadLibrary("ninebot_ffi")` is called by
      # the app (M365Native.kt), so an APK without libninebot_ffi.so throws
      # UnsatisfiedLinkError and no BLE handshake, login or telemetry decryption
      # can work. This job therefore builds the native library rather than
      # skipping it.
      #
      # This replaces an earlier `-PskipRustBuild` that made the job
      # self-contradictory: it skipped the Rust build and then ran an ELF check
      # requiring the very artifacts the skip prevented. Because
      # `app/src/main/jniLibs/` is gitignored (the .so files are generated, not
      # committed), a fresh checkout has none, so that step could only fail.
      # ---------------------------------------------------------------------
      - name: Install Rust with Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustup target add --toolchain stable \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      # Keyed on both crates: ninebot-ffi depends on ninebot-ble by path, so a
      # change to ninebot-ble's crypto changes the compiled output. Hashing only
      # the ffi crate would restore a stale target/ directory after a
      # ninebot-ble edit.
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ninebot-ffi/target
            ninebot-ble/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ninebot-ffi/Cargo.toml', 'ninebot-ffi/src/**', 'ninebot-ble/Cargo.toml', 'ninebot-ble/src/**') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory is unavailable"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: Test Rust protocol core
        run: cargo test --manifest-path ninebot-ble/Cargo.toml --no-default-features

      - name: Test Rust JNI crate
        run: |
          cargo test --manifest-path ninebot-ffi/Cargo.toml
          bash ninebot-ffi/tests/run-jni-tests.sh

      # Debug unit tests pull in `preBuild` -> verifyRustJniLibs -> copyRustJniLibs ->
      # buildRustJni, so this step both runs the unit tests and builds, copies
      # and freshness-checks the native libraries. verifyRustJniLibs fails the
      # build if the .so is missing or does not match a content hash of the Rust
      # sources, which is what makes "edited Rust but did not rebuild"
      # impossible.
      - name: Run Unit Tests
        env:
          M365_NATIVE_TEST_LIBRARY: ${{ github.workspace }}/ninebot-ffi/target/debug/libninebot_ffi.so
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :glass-hud:testDebugUnitTest

      - name: Assemble Debug APKs
        run: |
          ./gradlew --no-daemon :app:assembleDebug :glass-hud:assembleDebug

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug -PskipRustBuild

      - name: Verify 16 KB page alignment of native libraries
        shell: python3 {0}
        run: |
          import glob, struct, sys

          def pt_load_aligns(path):
              d = open(path, 'rb').read()
              if d[:4] != b'\x7fELF':
                  raise SystemExit(f'{path} is not an ELF file')
              is64 = d[4] == 2
              if is64:
                  phoff = struct.unpack_from('<Q', d, 32)[0]
                  entsize, num = struct.unpack_from('<HH', d, 54)
              else:
                  phoff = struct.unpack_from('<I', d, 28)[0]
                  entsize, num = struct.unpack_from('<HH', d, 42)
              aligns = []
              for i in range(num):
                  o = phoff + i * entsize
                  if struct.unpack_from('<I', d, o)[0] != 1:   # PT_LOAD
                      continue
                  aligns.append(struct.unpack_from('<Q', d, o + 48)[0] if is64
                                else struct.unpack_from('<I', d, o + 28)[0])
              return aligns

          libs = sorted(glob.glob('app/src/main/jniLibs/*/libninebot_ffi.so'))
          expected_abis = {'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'}
          found_abis = {so.split('/')[-2] for so in libs}
          if found_abis != expected_abis:
              print(f'::error::Expected {sorted(expected_abis)}, found {sorted(found_abis)}')
              sys.exit(1)
          if not libs:
              print('::error::no libninebot_ffi.so found under app/src/main/jniLibs')
              sys.exit(1)

          failed = False
          for so in libs:
              aligns = pt_load_aligns(so)
              bad = [a for a in aligns if a < 0x4000]
              print(f"{so}: {[hex(a) for a in aligns]}")
              if not aligns:
                  print(f'::error::{so} has no PT_LOAD segments')
                  failed = True
              elif bad:
                  print(f'::error::{so} has PT_LOAD align {[hex(a) for a in bad]}, need >= 0x4000')
                  failed = True
          sys.exit(1 if failed else 0)

      - name: Require SonarCloud automatic analysis
        uses: actions/github-script@v7
        with:
          script: |
            // 專案已啟用自動分析；只接受本次提交、SonarCloud App 的成功結果。
            const ref = context.payload.pull_request?.head.sha ?? context.sha;
            for (let attempt = 0; attempt < 30; attempt++) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref, per_page: 100,
              });
              const sonar = checks.filter(check =>
                check.head_sha === ref && check.app?.slug === 'sonarqubecloud' &&
                check.name === 'SonarCloud Code Analysis'
              ).sort((a, b) => b.id - a.id)[0];
              if (sonar?.status === 'completed') {
                if (sonar.conclusion !== 'success') {
                  core.setFailed(`SonarCloud: ${sonar.conclusion} (${sonar.details_url})`);
                } else {
                  core.info(`SonarCloud passed for ${ref}: ${sonar.details_url}`);
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed(`SonarCloud did not finish for ${ref} within five minutes`);

  rust-tests:
    name: Rust protocol and FFI tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test protocol and FFI
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --manifest-path ninebot-ble/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --manifest-path ninebot-ffi/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
